{% extends "base.html" %}{% block content %}<h2>Academic Results</h2><form method="post" class="grid"><input name="student_id" placeholder="Student ID" required><input name="academic_year" placeholder="Academic year"><input name="term" placeholder="Term"><input name="subject" placeholder="Subject" required><input name="test_score" type="number" step=".01" placeholder="Test score"><input name="assignment_score" type="number" step=".01" placeholder="Assignment score"><input name="exam_score" type="number" step=".01" placeholder="Exam score"><input name="remarks" placeholder="Remarks"><button>Record Result</button></form><table><tr><th>Student</th><th>Subject</th><th>Year</th><th>Term</th><th>Total</th><th>Grade</th></tr>{% for r in results %}<tr><td>{{r.full_name or r.student_id}}</td><td>{{r.subject}}</td><td>{{r.academic_year}}</td><td>{{r.term}}</td><td>{{'%.2f'|format(r.total_score)}}</td><td>{{r.grade}}</td></tr>{% endfor %}</table>{% endblock %}
