{% extends "base.html" %}{% block content %}<h2>Student Management</h2><form method="post" class="grid"><input name="student_id" placeholder="Student ID" required><input name="admission_no" placeholder="Admission No"><input name="full_name" placeholder="Full name" required><select name="gender"><option>Male</option><option>Female</option></select><input name="date_of_birth" type="date"><input name="programme" placeholder="Programme"><input name="class_name" placeholder="Class"><input name="house" placeholder="House"><input name="admission_year" type="number" placeholder="Admission year"><input name="guardian_name" placeholder="Guardian name"><input name="guardian_phone" placeholder="Guardian phone"><button>Add Student</button></form><table><tr><th>ID</th><th>Name</th><th>Gender</th><th>Programme</th><th>Class</th><th>Guardian</th></tr>{% for s in students %}<tr><td>{{s.student_id}}</td><td>{{s.full_name}}</td><td>{{s.gender}}</td><td>{{s.programme}}</td><td>{{s.class_name}}</td><td>{{s.guardian_name}}</td></tr>{% endfor %}</table>{% endblock %}
