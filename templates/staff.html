{% extends "base.html" %}{% block content %}<h2>Staff Management</h2><form method="post" class="grid"><input name="staff_id" placeholder="Staff ID" required><input name="full_name" placeholder="Full name" required><select name="gender"><option>Male</option><option>Female</option></select><input name="department" placeholder="Department"><input name="subject" placeholder="Subject"><input name="position" placeholder="Position"><input name="phone" placeholder="Phone"><input name="email" placeholder="Email"><button>Add Staff</button></form><table><tr><th>ID</th><th>Name</th><th>Department</th><th>Subject</th><th>Position</th><th>Phone</th></tr>{% for s in staff %}<tr><td>{{s.staff_id}}</td><td>{{s.full_name}}</td><td>{{s.department}}</td><td>{{s.subject}}</td><td>{{s.position}}</td><td>{{s.phone}}</td></tr>{% endfor %}</table>{% endblock %}
