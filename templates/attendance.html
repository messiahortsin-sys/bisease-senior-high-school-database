{% extends "base.html" %}{% block content %}<h2>Attendance</h2><form method="post" class="grid"><input name="student_id" placeholder="Student ID" required><input name="attendance_date" type="date" required><input name="class_name" placeholder="Class"><select name="status"><option>Present</option><option>Absent</option><option>Late</option></select><input name="reason" placeholder="Reason"><button>Record Attendance</button></form><table><tr><th>Date</th><th>Student</th><th>Class</th><th>Status</th><th>Reason</th></tr>{% for a in attendance %}<tr><td>{{a.attendance_date}}</td><td>{{a.full_name or a.student_id}}</td><td>{{a.class_name}}</td><td>{{a.status}}</td><td>{{a.reason}}</td></tr>{% endfor %}</table>{% endblock %}
